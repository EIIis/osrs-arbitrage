services:
  - type: web
    name: osrs-arbitrage-api
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: osrs-arbitrage-db
          property: connectionString
      - key: ADMIN_API_KEY
        generateValue: true
      - key: RUNELITE_API_BASE_URL
        value: https://prices.runescape.wiki/api/v1/osrs
      - key: POLL_INTERVAL_MINUTES
        value: 5
      - key: API_V1_PREFIX
        value: /api/v1
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ORIGINS
        value: "*"

databases:
  - name: osrs-arbitrage-db
    databaseName: osrs_arbitrage
    plan: free
